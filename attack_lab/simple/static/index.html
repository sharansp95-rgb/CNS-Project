<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mallory</title>
<style>
:root{--bg:#000;--panel:#0f0f0f;--line:#333;--fg:#f5f5f5;--mut:#b8b8b8;--red:#ff7b72;--amb:#f2c14e;--grn:#62d394;--blu:#79b8ff}
@media (prefers-color-scheme:light){:root{--bg:#fff;--panel:#fff;--line:#ddd;--fg:#111;--mut:#555;--red:#c62828;--amb:#8a5a00;--grn:#1b7f4b;--blu:#1456b8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;color:var(--red)}.sub{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1.2fr);gap:12px;padding:12px 16px}
@media (max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
h2{margin:0;padding:8px 12px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line)}
.rows{max-height:72vh;overflow:auto}.empty{padding:16px;color:var(--mut)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.who{font-weight:600}.meta{color:var(--mut);font-size:12px}.ct{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--mut);word-break:break-all;grid-column:1/3}
.badge{font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid currentColor;border-radius:6px;padding:1px 8px}
.st-dropped,.st-tampered{color:var(--red)}.st-replayed{color:var(--amb)}.st-delivered{color:var(--grn)}
.attacks{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px 0}
.attacks button{min-width:7.5rem;padding:12px 18px;font-size:16px}
#armed{padding:8px 16px 0;font-size:15px;color:var(--mut);min-height:2.2em}#armed.on{color:var(--amb);font-weight:700}
button{font:inherit;font-weight:700;letter-spacing:.03em;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--blu)}button:focus-visible{outline:2px solid var(--blu)}
button.armed{background:var(--amb);color:#111;border-color:var(--amb)}
#reset{font-weight:600}
.feed{padding:4px 12px;max-height:72vh;overflow:auto}.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.armed-l{color:var(--amb)}.did{color:var(--fg)}.result{color:var(--red);font-weight:600}
</style></head><body>
<header><div><h1>Mallory</h1><div class="sub">I control the network. I cannot read the messages.</div></div>
<button id="reset">Reset</button></header>
<div class="attacks" role="group" aria-label="Attack for the next message">
 <button data-a="tamper" aria-pressed="false">TAMPER</button><button data-a="drop" aria-pressed="false">DROP</button><button data-a="replay" aria-pressed="false">REPLAY</button></div>
<div id="armed" role="status" aria-live="polite">Nothing armed. Messages pass untouched.</div>
<main>
 <section><h2>Messages passing through (ciphertext only)</h2><div class="rows" id="rows"><div class="empty">Waiting for the first message…</div></div></section>
 <section><h2>What happened</h2><div class="feed" id="feed" aria-live="polite"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let last="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const time=t=>new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
async function post(path,body){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}
async function poll(){try{const s=await (await fetch("/api/state")).json();
 document.querySelectorAll(".attacks button").forEach(b=>{const on=s.armed===b.dataset.a;b.classList.toggle("armed",on);b.setAttribute("aria-pressed",on)});
 $("armed").className=s.armed?"on":"";
 $("armed").textContent=s.armed?`Armed: ${s.armed.toUpperCase()} — waiting for next message`:"Nothing armed. Messages pass untouched.";
 const html=s.rows.length?s.rows.slice().reverse().map(r=>{
  const mark=r.status==="delivered"?"":` <span class="badge st-${r.status}">${r.status.toUpperCase()}</span>`;
  return `<div class="row"><div><span class="who">${esc(r.from)} → ${esc(r.to)}</span> <span class="meta">${time(r.ts)} · ${r.bytes} bytes</span>${mark}</div><div></div><div class="ct">${esc(r.ct)}</div></div>`}).join(""):'<div class="empty">Waiting for the first message…</div>';
 if(html!==last){last=html;$("rows").innerHTML=html}
 $("feed").innerHTML=s.feed.slice().reverse().map(f=>`<div class="${f.kind==="armed"?"armed-l":f.kind}">${time(f.t)} ${esc(f.text)}</div>`).join("")||'<div class="empty">Nothing yet. Arm TAMPER, DROP or REPLAY, then send a message.</div>';
}catch(e){}}
document.querySelector(".attacks").onclick=e=>{const b=e.target.closest("button");if(b)post("/api/arm",{action:b.dataset.a}).then(poll)};
$("reset").onclick=()=>post("/api/reset").then(()=>{last="";poll()});
poll();setInterval(poll,400);
</script></body></html>
